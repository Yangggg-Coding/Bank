<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/Script/theme.js"></script>
    <link rel="icon" type="png" href="/Image/Logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/Style/nav.css" />
    <link rel="stylesheet" href="/Style/tranfer.css" />
    <title>Bank | Deposit</title>
  </head>
  <body>
    <head>
      <nav class="head">
        <div class="head-1">
          <i class="fa-solid fa-building-columns"></i>
          <p>Bank Kon Khmer</p>
        </div>
        <div class="head-2">
          <a href="/Page/index.html">
            <div>
              <i class="fa-solid fa-house"></i>
              <p>Dashboard</p>
            </div></a
          >
          <!-- transactions -->
          <a href="/Page/transactions.html">
            <div>
              <i class="fa-solid fa-list"></i>
              <p>Transfer</p>
            </div></a
          >
          <a href="/Page/deposit.html " class="active"
            ><div>
              <i class="fa-solid fa-plus"></i>
              <p>Deposit</p>
            </div></a
          >
          <!-- Add transactions -->
          <a href="/Page/add-transaction.html"
            ><div>
              <i class="fa-solid fa-plus"></i>
              <p>Transfer</p>
            </div></a
          >

          <!-- Statistics -->
          <a href="/Page/statistics.html">
            <div>
              <i class="fa-solid fa-chart-simple"></i>
              <p>Statistics</p>
            </div></a
          >

          <!-- Setting -->
          <a href="/Page/settings.html">
            <div>
              <i class="fa-solid fa-gear"></i>
              <p>Setting</p>
            </div></a
          >
        </div>
      </nav>
    </head>
    <!-- Page -->
    <main class="main">
      <section class="add-fea">
        <div class="add-features">
          <h1>Transfer Money</h1>
          <h4>Send money to another account.</h4>
        </div>

        <div class="add-features-1">
          <p>Available Balance</p>
          <span class="js-balance">$0.00</span>
        </div>
        <div>
          <div class="add-features-2">
            <p>Recipient Account</p>
            <input
              type=" text"
              placeholder="Account number or Username"
              class="js-accNumUser"
            />
            <p>Amount</p>
            <input class="js-amount" type="text" placeholder="$0.00" />
            <p>Note (Optional)</p>
            <input
              class="js-description"
              type="text"
              placeholder="What's this for?"
            />
          </div>
          <button class="js-deposit">Deposit</button>
        </div>
      </section>
    </main>
  </body>
  <script type="module" src="/Script/deposit.js"></script>
</html>
